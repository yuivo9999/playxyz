<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>小说阅读助手</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- 顶栏：🗑 清空并新对话 | 标题 | ⚙ 生成索引 -->
<header class="topbar">
  <button id="clearConvBtn" class="icon-btn" title="清空并开启新对话（阅后即焚）" aria-label="清空并新对话">🗑</button>
  <div id="convTitle" class="topbar-title">新对话</div>
  <button id="indexerBtn" class="icon-btn" title="分析概括小说（生成索引）" aria-label="生成索引">⚙</button>
</header>

<!-- 主内容：聊天区 -->
<main class="chat-main">
  <div id="chatMsgs" class="chat-msgs">
    <div class="empty-hint">开始对话吧。<br>点击底部 <strong>＋</strong> 上传小说 TXT，AI 即可阅读并回答你的问题。<br><span class="muted small">🔥 阅后即焚：关闭本页后数据自动清除</span></div>
  </div>
</main>

<!-- 底部输入区 -->
<footer class="chat-foot">
  <button id="modelBtn" class="model-pill" title="切换模型">
    <span id="modelLabel">添加模型</span>
    <span class="caret">▾</span>
  </button>
  <div class="foot-input-wrap">
    <textarea id="chatInput" rows="1" placeholder="发消息…"></textarea>
  </div>
  <button id="uploadBtn" class="foot-icon" title="上传小说 TXT">＋</button>
  <button id="sendBtn" class="foot-send" title="发送">发送</button>
  <button id="abortBtn" class="foot-abort" style="display:none" title="中止">■</button>
</footer>

<!-- 隐藏的文件选择框（由底部 ＋ 触发） -->
<input type="file" id="fileInput" accept=".txt,.md,text/plain,text/*" multiple style="position:absolute;width:0;height:0;opacity:0;overflow:hidden">

<!-- 模型选择下拉 -->
<div id="modelMenu" class="model-menu" style="display:none">
  <div class="model-menu-head">选择模型</div>
  <div id="modelMenuList"></div>
  <button id="addModelFromMenuBtn" class="btn-mini" style="width:100%;margin-top:6px">＋ 添加新模型</button>
</div>

<!-- 模型编辑 Modal -->
<div id="modelModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="modelModalTitle">添加模型</div>
      <button class="icon-btn" data-close="modelModal">✕</button>
    </div>
    <div class="modal-body">
      <!-- NVIDIA 一键识别（推荐） -->
      <div class="nvidia-paste">
        <details>
          <summary>🚀 从 NVIDIA 网站粘贴代码自动识别（推荐）</summary>
          <p class="muted small paste-hint">
            进入 <a href="https://build.nvidia.com/" target="_blank" rel="noopener">build.nvidia.com</a> → 选模型 → <strong>Build</strong> → 切到 <strong>Node</strong> 标签 → 复制全部代码 → 粘贴到下方：
          </p>
          <textarea id="nvidiaPaste" rows="6" placeholder="import axios from 'axios';&#10;&#10;const invokeUrl = &quot;https://integrate.api.nvidia.com/v1/chat/completions&quot;;&#10;..."></textarea>
          <div class="row" style="margin-top:6px;align-items:center">
            <button id="parseNvidiaBtn" class="btn-mini primary">🔍 自动识别并填入下方</button>
            <span id="nvidiaParseStatus" class="muted small"></span>
          </div>
          <hr class="or-divider">
          <p class="muted small" style="margin:0 0 4px">或手动填写：</p>
        </details>
      </div>

      <div class="form-grid">
        <label>名称（别名）<input id="apiAlias" placeholder="如 my-nvidia-model"></label>
        <label>URL<input id="apiBaseUrl" placeholder="https://integrate.api.nvidia.com/v1"></label>
        <label>API Key<input id="apiKey" type="password" placeholder="nvapi-..."></label>
        <label>Model（必填，如 google/gemma-4-31b-it）<input id="apiModel" placeholder="google/gemma-4-31b-it"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="saveModelBtn" class="btn-mini">保存</button>
        <button id="delModelBtn" class="btn-mini danger" style="display:none">删除此模型</button>
      </div>
      <p class="muted small" style="margin-top:8px">⚠️ 密钥以明文存于本浏览器 localStorage。</p>
    </div>
  </div>
</div>

<!-- 索引面板 Modal（选书 + 模式 + 开始） -->
<div id="indexerModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">⚙ 分析概括小说</div>
      <button class="icon-btn" data-close="indexerModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <label>选书
          <select id="bookSelect"></select>
        </label>
        <label>模式
          <select id="modeSelect">
            <option value="speed">speed（并发）</option>
            <option value="deep">deep（串行+滚动记忆）</option>
          </select>
        </label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="startIndexBtn" class="btn-mini">▶ 开始生成索引</button>
        <button id="abortIndexBtn" class="btn-mini danger" style="display:none">中止</button>
      </div>
      <div id="progressWrap" class="progress-wrap" style="display:none;margin-top:8px">
        <div id="progressText" class="progress-text small">—</div>
        <div class="progress-bar"><div id="progressBar" class="progress-fill"></div></div>
      </div>
      <pre id="indexLog" class="log" style="display:none;max-height:240px"></pre>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>

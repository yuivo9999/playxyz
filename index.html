<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#ffffff">
<title>小说阅读助手</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- 顶栏 -->
<header class="topbar">
  <button id="menuBtn" class="icon-btn" title="设置" aria-label="设置">☰</button>
  <div id="convTitle" class="topbar-title">新对话</div>
  <button id="assetBtn" class="icon-btn" title="资产库" aria-label="资产库">📚</button>
  <button id="indexerBtn" class="icon-btn" title="生成索引（VCPBookIndexGen）" aria-label="生成索引">⚙</button>
  <button id="newConvBtn" class="icon-btn" title="新对话" aria-label="新对话">＋</button>
</header>

<!-- 设置抽屉（左侧滑出） -->
<aside id="drawer" class="drawer">
  <div class="drawer-mask" data-close-drawer></div>
  <div class="drawer-panel">
    <div class="drawer-head">
      <strong>设置</strong>
      <button class="icon-btn" data-close-drawer>✕</button>
    </div>
    <div class="drawer-section">
      <div class="drawer-h">对话</div>
      <div id="historyList" class="history-list"></div>
    </div>
    <div class="drawer-section">
      <div class="drawer-h">数据</div>
      <div class="row">
        <button id="exportJsonBtn" class="btn-mini">导出 JSON</button>
        <button id="importJsonBtn" class="btn-mini">导入 JSON</button>
      </div>
      <div class="row" style="margin-top:6px">
        <button id="clearAllBtn" class="btn-mini danger">清空全部</button>
      </div>
    </div>
    <div class="drawer-section">
      <div class="drawer-h">默认参数</div>
      <div class="form-grid">
        <label>切块大小（字符）<input id="chunkSize" type="number" value="1500"></label>
        <label>并发数（speed 模式）<input id="maxConcurrency" type="number" value="3"></label>
        <label>自定义章节正则<input id="splitPattern" placeholder="留空用默认"></label>
      </div>
      <button id="saveDefaultsBtn" class="btn-mini" style="margin-top:6px">保存默认值</button>
    </div>
  </div>
</aside>

<!-- 资产库（右侧滑出） -->
<aside id="assetDrawer" class="drawer drawer-right">
  <div class="drawer-mask" data-close-asset></div>
  <div class="drawer-panel">
    <div class="drawer-head">
      <strong>资产库</strong>
      <button class="icon-btn" data-close-asset>✕</button>
    </div>
    <div id="assetDropZone" class="drop-zone mini">
      <p>拖拽 TXT / MD 到这里</p>
      <p class="muted small">或 <button id="pickFileBtn" class="btn-mini">选择文件</button></p>
      <input type="file" id="fileInput" accept=".txt,.md,text/plain,text/*" multiple style="position:absolute;left:-9999px;width:1px;height:1px;opacity:0">
    </div>
    <div class="row" style="margin:8px 0">
      <button id="mergeBookBtn" class="btn-mini">合并勾选 TXT 为一本书</button>
    </div>
    <div id="assetList" class="asset-list"></div>
  </div>
</aside>

<!-- 主内容：聊天区 -->
<main class="chat-main">
  <div id="chatMsgs" class="chat-msgs">
    <div class="empty-hint">开始对话吧。<br>点击左下角 <strong>＋</strong> 上传小说作为上下文。</div>
  </div>
</main>

<!-- 底部输入区 -->
<footer class="chat-foot">
  <button id="uploadBtn" class="foot-icon" title="添加小说">＋</button>
  <button id="modelBtn" class="model-pill" title="切换模型">
    <span id="modelLabel">添加模型</span>
    <span class="caret">▾</span>
  </button>
  <div class="foot-input-wrap">
    <textarea id="chatInput" rows="1" placeholder="发消息…"></textarea>
  </div>
  <button id="sendBtn" class="foot-send" title="发送">发送</button>
  <button id="abortBtn" class="foot-abort" style="display:none" title="中止">■</button>
</footer>

<!-- 模型选择下拉 -->
<div id="modelMenu" class="model-menu" style="display:none">
  <div class="model-menu-head">选择模型</div>
  <div id="modelMenuList"></div>
  <button id="addModelFromMenuBtn" class="btn-mini" style="width:100%;margin-top:6px">＋ 添加新模型</button>
</div>

<!-- 模型编辑 Modal -->
<div id="modelModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title" id="modelModalTitle">添加模型</div>
      <button class="icon-btn" data-close="modelModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <label>别名<input id="apiAlias" placeholder="如 deepseek-official"></label>
        <label>Base URL<input id="apiBaseUrl" placeholder="https://api.deepseek.com/v1"></label>
        <label>API Key<input id="apiKey" type="password" placeholder="sk-..."></label>
        <label>Model<input id="apiModel" placeholder="deepseek-chat"></label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="saveModelBtn" class="btn-mini">保存</button>
        <button id="delModelBtn" class="btn-mini danger" style="display:none">删除此模型</button>
      </div>
      <p class="muted small" style="margin-top:8px">⚠️ 密钥以明文存于本浏览器 localStorage。</p>
    </div>
  </div>
</div>

<!-- 资产查看 Modal -->
<div id="viewerModal" class="modal">
  <div class="modal-card large">
    <div class="modal-head">
      <div>
        <div id="viewerTitle" class="modal-title">查看</div>
        <div id="viewerMeta" class="muted small"></div>
      </div>
      <button class="icon-btn" data-close="viewerModal">✕</button>
    </div>
    <pre id="viewerBody" class="modal-body scroll"></pre>
  </div>
</div>

<!-- 索引面板 Modal（隐藏的二级页：合并 + 选模式 + 开始） -->
<div id="indexerModal" class="modal">
  <div class="modal-card">
    <div class="modal-head">
      <div class="modal-title">⚙ VCPBookIndexGen</div>
      <button class="icon-btn" data-close="indexerModal">✕</button>
    </div>
    <div class="modal-body">
      <div class="form-grid">
        <label>选书
          <select id="bookSelect"></select>
        </label>
        <label>模式
          <select id="modeSelect">
            <option value="speed">speed（并发）</option>
            <option value="deep">deep（串行+滚动记忆）</option>
          </select>
        </label>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="startIndexBtn" class="btn-mini">▶ 开始生成索引</button>
        <button id="abortIndexBtn" class="btn-mini danger" style="display:none">中止</button>
      </div>
      <div id="progressWrap" class="progress-wrap" style="display:none;margin-top:8px">
        <div id="progressText" class="progress-text small">—</div>
        <div class="progress-bar"><div id="progressBar" class="progress-fill"></div></div>
      </div>
      <pre id="indexLog" class="log" style="display:none;max-height:240px"></pre>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
